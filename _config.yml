# GitHub Pages (Jekyll) settings. Pages are pre-built by _tools/build.py,
# so Jekyll should only copy files. Folders starting with "_" stay unpublished.

# Serve the .md copies (page.html.md, agents.md) as raw Markdown for AI
# assistants instead of letting jekyll-optional-front-matter render them.
require_front_matter: true

include:
  - .well-known
exclude:
  - README.md
